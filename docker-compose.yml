services:
  backend:
    build: .
    container_name: campus-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=campus_user
      - DB_PASSWORD=campus_pass
      - DB_NAME=campus_food_delivery
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=campus_food_delivery
      - POSTGRES_USER=campus_user
      - POSTGRES_PASSWORD=campus_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro