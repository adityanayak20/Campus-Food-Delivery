<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - BITS & BITES</title>
    <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>

    <div class="logo-container">
        <img src="/frontend/assets/BITSANDBITES.png" alt="BITS & BITES Logo" class="logo">
    </div>

    <div class="login-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('login')">Student Login</button>
            <button class="tab-btn" onclick="showTab('signup')">Student Sign Up</button>
            <button class="tab-btn" onclick="showTab('admin')">Admin Login</button>
            <button class="tab-btn" onclick="showTab('delivery')">Delivery Login</button>
        </div>
    
        <!-- Login Form -->
        <div id="login" class="tab-content">
            <h2>Login</h2>
            <form id="loginForm" onsubmit="loginStudent(event)">
                <input type="tel" class="input-field" id="loginPhone" placeholder="Phone Number" required>
                <button type="submit" class="signup-btn">Login</button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup" class="tab-content" style="display: none;">
            <h2>Sign Up</h2>
            <form id="studentForm" onsubmit="registerStudent(event)">
                <input type="text" class="input-field" id="firstName" placeholder="First Name" required>
                <input type="text" class="input-field" id="lastName" placeholder="Last Name" required>
                <input type="tel" class="input-field" id="phoneNo" placeholder="Phone Number" required>
                <input type="email" class="input-field" id="email" placeholder="BITS Email ID" required>
                <select class="input-field" id="hostel" required>
                    <option value="">Select Hostel</option>
                    <option value="AH">AH</option>
                    <option value="CH">CH</option>
                    <option value="DH">DH</option>
                </select>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
        </div>

        <!-- Admin Login Form -->
        <div id="admin" class="tab-content" style="display: none;">
            <h2>Admin Login</h2>
            <form id="adminForm" onsubmit="loginAdmin(event)">
                <input type="text" class="input-field" id="adminUsername" placeholder="Username" required>
                <input type="password" class="input-field" id="adminPassword" placeholder="Password" required>
                <button type="submit" class="signup-btn">Login as Admin</button>
            </form>
        </div>

        <!-- Delivery Login Form -->
        <div id="delivery" class="tab-content" style="display: none;">
            <h2>Delivery Login</h2>
            <form id="deliveryForm" onsubmit="loginDelivery(event)">
                <input type="tel" class="input-field" id="deliveryPhone" placeholder="Phone Number" required>
                <button type="submit" class="signup-btn">Login as Delivery Person</button>
            </form>
        </div>
        <p class="terms">
            By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </p>
    </div>

    <script src="/frontend/js/script.js"></script>
</body>
</html>
